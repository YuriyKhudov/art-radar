name: Art Radar provider connectivity check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the public OpenRouter catalog
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = 'https://openrouter.ai/api/v1/models'
          with urllib.request.urlopen(url, timeout=20) as response:
              status = response.status
              models = {row['id']: row for row in json.load(response)['data']}
          eligible = []
          for name in ('inclusionai/ling-3.2-flash:free', 'baidu/ernie-5.5-flash-preview:free', 'google/gemma-4-31b-it:free'):
              model = models.get(name)
              if model and all(float(model["pricing"].get(field, "0" if field == "request" else "nan")) == 0 for field in ("prompt", "completion", "request")):
                  eligible.append(name)
          print('OpenRouter catalog HTTP', status)
          print('Zero-price variants:', ', '.join(eligible))
          assert status == 200 and eligible
          PY
