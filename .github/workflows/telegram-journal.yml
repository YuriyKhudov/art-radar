name: Изолированная проверка редактора Art Radar

on:
  workflow_dispatch:
    inputs:
      mode:
        type: string
        default: editor_benchmark

permissions:
  contents: read

jobs:
  editor:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [qwen3-4b, qwen25-7b, gemma3-4b]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'trafilatura==2.3.1' 'Protego==0.7.0'
      - name: Проверить редактуру трёх одинаковых оригиналов
        env:
          ART_RADAR_RUN_LOCAL_EDITOR: '1'
          ART_RADAR_EDITOR_CACHE: ${{ runner.temp }}/art-radar-editor
          MODEL: ${{ matrix.model }}
        run: |
          mkdir -p editor-report
          { nproc; free -m; df -h .; } | tee editor-report/runner.txt
          python -u journal-review/editor-benchmark.py --model "$MODEL" \
            --models journal-review/editor-benchmark-models.json --output editor-report/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-${{ matrix.model }}
          path: editor-report/
