name: GigaChat API connectivity check
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe OAuth and models with certificate verification
        run: |
          python3 - <<'PY'
          import hashlib, json, ssl, urllib.error, urllib.parse, urllib.request, uuid
          
          ca_url = "https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt"
          endpoints = [
              ("OAuth", "https://ngw.devices.sberbank.ru:9443/api/v2/oauth", "POST"),
              ("Models", "https://api.giga.chat/v1/models", "GET"),
          ]
          contexts = [("System roots", ssl.create_default_context())]
          try:
              with urllib.request.urlopen(ca_url, timeout=12) as response:
                  ca = response.read(65536).decode("ascii")
              certificate = ssl.PEM_cert_to_DER_cert(ca.strip())
              ctx = ssl.create_default_context()
              ctx.load_verify_locations(cadata=ca)
              print("Official CA retrieved with verified TLS; SHA-256", hashlib.sha256(certificate).hexdigest(), flush=True)
              contexts.append(("System roots plus official CA", ctx))
          except (OSError, ValueError) as error:
              print("Official CA retrieval:", type(error).__name__, str(error), flush=True)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          reachable = set()
          for name, context in contexts:
              opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPSHandler(context=context))
              for target, url, method in endpoints:
                  headers = {"Accept": "application/json", "User-Agent": "ArtRadar-GigaChat-Connectivity"}
                  data = None
                  if method == "POST":
                      headers["Content-Type"] = "application/x-www-form-urlencoded"
                      headers["RqUID"] = str(uuid.uuid4())
                      data = urllib.parse.urlencode({"scope": "GIGACHAT_API_PERS"}).encode()
                  request = urllib.request.Request(url, data=data, method=method, headers=headers)
                  try:
                      with opener.open(request, timeout=12) as response:
                          print(f"{name} | {target}: HTTP {response.status}; TLS verified", flush=True)
                          if response.status == 200 and method == "GET":
                              reachable.add(target)
                  except urllib.error.HTTPError as error:
                      body = error.read(350).decode("utf-8", "replace")
                      print(f"{name} | {target}: HTTP {error.code}; TLS verified; {body!r}", flush=True)
                      if error.code in (400, 401):
                          reachable.add(target)
                  except OSError as error:
                      print(f"{name} | {target}: {type(error).__name__}: {error}", flush=True)
          
          print("Endpoints reached and requesting authorization:", ", ".join(sorted(reachable)), flush=True)
          if len(reachable) != len(endpoints):
              raise SystemExit(1)
          PY
