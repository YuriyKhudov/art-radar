name: Art Radar — isolated Cloudflare editor evaluation
on: workflow_dispatch
permissions: {}
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Generate from verified facts and validate editorial JSON
        env:
          ART_RADAR_CLOUDFLARE_API_TOKEN: ${{ secrets.ART_RADAR_CLOUDFLARE_API_TOKEN }}
          ART_RADAR_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ART_RADAR_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          
          ARTICLES = json.loads(r'''[{"title":"Разбор одного шедевра: «Не ждали» Ильи Репина","url":"https://arzamas.academy/mag/1268-aspettami","facts":["Основная версия «Не ждали» написана Ильёй Репиным в 1884–1888 годах. Она находится в Государственной Третьяковской галерее и связана с революционным циклом художника.","В сцене в комнату входит человек, которого принято считать возвращённым из ссылки революционером. Это распространённая версия сюжета, единственного доказанного ответа о его биографии нет.","На стене висит посмертная фотография Александра II. Автор разбора предполагает, что герой мог вернуться после пересмотра административных дел. Правовой статус дела конкретного героя неизвестен.","Репин четыре раза переписывал лицо вошедшего, смысл своих изменений он не объяснил даже близким друзьям.","Девочка, мальчик и женщина у рояля реагируют по-разному. Родство отдельных персонажей и их эмоции остаются предметом интерпретации.","В меньшем варианте, написанном в 1883 году маслом по дереву и частично переписанном в 1898 году, из ссылки возвращается молодая женщина."],"anchors":["Репин","Не ждали","1884","1888","ссыл","административн"],"forbidden":["уголовн"]},{"title":"Живопись впечатлений на фоне парижской разрухи","url":"https://www.theartnewspaper.ru/posts/20261113-cfjj/","facts":["Ольга Кабанова 13 ноября 2026 года опубликовала рецензию на книгу австралийского арт-критика Себастьяна Сми о рождении импрессионизма.","Русское издание «Париж в руинах: любовь, война и рождение импрессионизма» вышло в 2026 году в переводе И. Волковой. Это рецензия на книгу, а не на выставку.","В центре книги отношения Эдуарда Мане и Берты Моризо на фоне Франко-прусской войны и осады Парижа. По словам рецензента, Себастьян Сми опирался на документальные свидетельства. Их происхождение в изложении уточнять не нужно.","Салон 1870 года предшествовал началу войны. Среди его участников были Мане и Моризо, Эдгар Дега, Огюст Ренуар и Альфред Сислей.","Себастьян Сми пересказывает рассказ Моризо. По её словам, Мане взялся переделывать картину, которую она готовила к Салону, и результат ей не понравился.","По наблюдению рецензента, художники этого круга продолжили писать мирные сцены, портреты и пейзажи. Ольга Кабанова считает исторический контекст более удачной частью книги, чем разбор живописи."],"anchors":["Сми","Мане","Моризо","1870","документальн"],"forbidden":["архивн","зафиксирован","самовольн"]}]''')
          model = "@cf/google/gemma-4-26b-a4b-it"
          token = os.environ["ART_RADAR_CLOUDFLARE_API_TOKEN"].strip()
          account = os.environ["ART_RADAR_CLOUDFLARE_ACCOUNT_ID"].strip()
          if not token or not re.fullmatch(r"[a-fA-F0-9]{32}", account):
              raise SystemExit("Cloudflare credentials missing or Account ID is malformed.")
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/v1/chat/completions"
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          client = urllib.request.build_opener(NoRedirect())
          schema = {
              "type": "object",
              "properties": {
                  "title": {"type": "string"},
                  "summary": {"type": "string"},
                  "fact_ids": {"type": "array", "items": {"type": "integer"}},
              },
              "required": ["title", "summary", "fact_ids"],
              "additionalProperties": False,
          }
          system = (
              "Ты пишешь для русскоязычного художественного журнала. Используй только переданные факты; "
              "сохраняй различие между установленными сведениями, предположениями и мнением рецензента. "
              "Напиши самостоятельное изложение на русском языке в объёме 600–1500 знаков, 2–3 коротких абзаца. "
              "Избегай пересказа заголовка, общих фраз, похвалы и обращения к читателю. "
               "Вплети необходимые имена, названия и даты в текст естественно. Используй хотя бы четыре факта. "
              "Не добавляй уточнений о характере дел, происхождении свидетельств или мотивах людей. "
              "Детали, которых нет в пакете, просто пропускай. Формулировки используй точные, без канцелярского языка. "
              "Верни только JSON с полями title (русский заголовок), summary (текст) и fact_ids (номера фактов из сообщения)."
          )
          def provider_request(article, strict):
              numbered = {i: fact for i, fact in enumerate(article["facts"], 1)}
              fields = {"тема": article["title"], "источник": article["url"], "факты": numbered,
                        "обязательные имена, даты или понятия в изложении": article["anchors"],
                        "неподтверждённые слова, которых нужно избегать": article["forbidden"]}
              response_format = {"type": "json_schema", "json_schema": {"name": "article_edit", "schema": schema, "strict": True}}
              if not strict:
                  response_format = {"type": "json_object"}
              payload = {"model": model, "messages": [{"role": "system", "content": system},
                          {"role": "user", "content": json.dumps(fields, ensure_ascii=False)}], "temperature": 0.2,
                          "chat_template_kwargs": {"enable_thinking": False}, "max_completion_tokens": 1200,
                          "response_format": response_format}
              req = urllib.request.Request(url, json.dumps(payload).encode(), headers={
                  "Authorization": "Bearer " + token, "Content-Type": "application/json", "Accept": "application/json",
              })
              started = time.monotonic()
              info = {"mode": response_format["type"]}
              try:
                  with client.open(req, timeout=45) as response:
                      info["http"] = response.status
                      result = json.loads(response.read(500001))
              except urllib.error.HTTPError as err:
                  info["http"] = err.code
                  try:
                      errors = json.loads(err.read(4000)).get("errors", [])
                      info["codes"] = [e.get("code") for e in errors if isinstance(e, dict) and isinstance(e.get("code"), int)]
                  except ValueError:
                      pass
                  result = None
              except (OSError, ValueError):
                  info["error"] = "transport-or-invalid-envelope"
                  result = None
              info["seconds"] = round(time.monotonic() - started, 1)
              if not isinstance(result, dict):
                  return info, None
              if isinstance(result.get("usage"), dict):
                  info["usage"] = {k: v for k, v in result["usage"].items() if type(v) is int}
              try:
                  choice = result["choices"][0]
                  info["finish_reason"] = choice.get("finish_reason") if choice.get("finish_reason") in ("stop", "length", "content_filter") else "other"
                  if info["finish_reason"] != "stop":
                      return info, None
                  content = choice["message"]["content"]
                  return info, json.loads(content) if isinstance(content, str) else content
              except (KeyError, IndexError, TypeError, ValueError):
                  info["error"] = "invalid-editor-json"
                  return info, None
          
          def validate(article, value):
              if not isinstance(value, dict) or set(value) != set(schema["required"]):
                  return ["invalid-json-shape"]
              title, summary, ids = value["title"], value["summary"], value["fact_ids"]
              if not isinstance(title, str) or not isinstance(summary, str) or not isinstance(ids, list):
                  return ["invalid-json-types"]
              errors = []
              letters = re.findall(r"[^\W\d_]", summary, re.UNICODE)
              if not title.strip() or len(title) > 140 or not 600 <= len(summary.strip()) <= 1500:
                  errors.append("length")
              if not letters or len(re.findall(r"[А-Яа-яЁё]", summary)) / len(letters) < 0.9:
                  errors.append("language")
              if not re.search(r"[.!?…][»”\"]?$", summary.strip()):
                  errors.append("unfinished-sentence")
              missing = [name for name in article["anchors"] if name.lower() not in summary.lower()]
              if missing:
                  errors.append("missing-anchors:" + ", ".join(missing))
              if any(stem in summary.lower() for stem in article["forbidden"]):
                  errors.append("unverified-detail")
              if any(type(i) is not int or not 1 <= i <= len(article["facts"]) for i in ids) or len(set(ids)) < 4:
                  errors.append("fact-ids")
              return errors
          
          rows = []
          for article in ARTICLES:
              row = {key: article[key] for key in ("title", "url")}
              attempts = row["attempts"] = []
              last_value = None
              for strict in (True,):
                  info, value = provider_request(article, strict)
                  errors = validate(article, value)
                  info["validation"] = errors
                  attempts.append(info)
                  print("ART_RADAR_ATTEMPT " + json.dumps({"article": article["title"], **info}, ensure_ascii=False), flush=True)
                  if isinstance(value, dict):
                      last_value = {k: value[k] for k in ("title", "summary", "fact_ids") if k in value}
                  if not errors or info.get("http") in (401, 403, 429):
                      break
              row["structural_pass"] = not errors
              row["output"] = last_value
              rows.append(row)
              line = json.dumps(row, ensure_ascii=False)
              print("ART_RADAR_RESULT " + line.replace(token, "***").replace(account, "***"), flush=True)
              if info.get("http") in (401, 403, 429):
                  break
          
          def safe(value):
              return html.escape(str(value).replace(token, "***").replace(account, "***"))
          
          report = ["# Cloudflare Workers AI — проверка редактуры", "", f"Модель: {model}. В модель переданы только отдельные факты.", ""]
          for row in rows:
              report.extend([f"## {safe(row['title'])}", "", f"[Оригинал]({row['url']})", ""])
              for attempt in row["attempts"]:
                  text = ", ".join(attempt["validation"]) or "проверки пройдены"
                  report.append(f"- {attempt['mode']} · {attempt.get('http', '—')} · {attempt['seconds']} с · {safe(text)}")
              if row["output"]:
                  title = row["output"].get("title", "")
                  summary = row["output"].get("summary", "")
                  report.extend(["", f"**{safe(title)}**", "", safe(summary), "", f"Объём: {len(summary)} знаков."])
              report.append("")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(report), encoding="utf-8")
          if len(rows) != len(ARTICLES) or not all(row["structural_pass"] for row in rows):
              raise SystemExit("Некоторые проверочные статьи не прошли автоматические проверки.")
          PY
