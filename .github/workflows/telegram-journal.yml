name: Cloudflare Workers AI connectivity check
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Cloudflare REST routes with certificate verification
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          
          base = "https://api.cloudflare.com/client/v4/accounts/" + "0" * 32 + "/ai"
          endpoints = [
              ("Model catalog", base + "/models/search?per_page=1", None),
              ("Gemma inference REST", base + "/run/@cf/google/gemma-4-26b-a4b-it", {"messages": [{"role": "user", "content": "Проверка API"}], "max_tokens": 8}),
          ]
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          for label, url, payload in endpoints:
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=data, headers={
                  "Accept": "application/json", "Content-Type": "application/json", "User-Agent": "ArtRadar-WorkersAI-Connectivity",
              })
              try:
                  with opener.open(request, timeout=12) as response:
                      print(f"{label}: HTTP {response.status}; TLS verified", flush=True)
                      if label == "Model catalog" and response.status == 200:
                          continue
                      raise SystemExit("Expected authorization to be required")
              except urllib.error.HTTPError as error:
                  body = json.loads(error.read(4096))
                  messages = [(item.get("code"), item.get("message")) for item in body.get("errors", [])]
                  print(f"{label}: HTTP {error.code}; TLS verified; {messages}", flush=True)
                  if error.code not in (400, 401, 403) or not any("auth" in str(message).lower() for _, message in messages):
                      raise
          print("Cloudflare Workers AI routes responded with verified TLS; no account or credentials supplied.", flush=True)
          PY
