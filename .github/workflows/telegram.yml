# Подборка Art Radar в ветку Telegram-группы через день (пн — лучшее за неделю, ср, пт, вс) в 12:00 по Москве (09:00 UTC).
# Программа запускается каждый день и сама решает, день ли сегодня для поста; ручной запуск отправляет пост всегда.
name: Пост в Telegram

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Русские заголовки берём из переводов, которые накапливает сборка сайта.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: translations-${{ github.run_id }}
          restore-keys: translations-
      - name: Отправить подборку
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Бот ещё не подключён — пропускаю"; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python -m radar.telegram_post --force; else python -m radar.telegram_post; fi
